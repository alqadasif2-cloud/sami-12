name: Build and Release Sami APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web and Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download the existing project
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install Web Dependencies
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      # 4. Build Web Application
      - name: Build Web Application
        run: npm run build

      # 5. Copy Web Assets into Android
      - name: Sync Web Assets to Android
        shell: bash
        run: |
          set -e

          if [ -d "app/src/main/assets" ]; then
            echo "Android assets directory exists."
          else
            mkdir -p app/src/main/assets
          fi

          if [ -d "dist" ]; then
            mkdir -p app/src/main/assets
            cp -a dist/. app/src/main/assets/
          else
            echo "::error::The dist directory was not generated."
            exit 1
          fi

          if [ -d "public" ]; then
            echo "Public directory found."
            echo "Ensure public files are copied only when required by the existing project."
          fi

      # 6. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 7. Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 9. Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 10. Build Debug APK
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # 11. Build Release APK
      - name: Build Release APK
        id: release_build
        continue-on-error: true
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # 12. List Generated APK Files
      - name: Find Generated APKs
        if: always()
        run: |
          echo "=== Generated APK Files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print || true

      # 13. Upload APKs
      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sami-Trading-Tracker-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Publish Build Summary
      - name: Publish Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sami Android Build Report"
            echo ""
            echo "- Repository: Existing Sami project"
            echo "- Debug APK: Check the build and artifact steps above."
            echo "- Release APK: Check the release build step above."
            echo "- APK artifacts: Sami-Trading-Tracker-APK"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.release_build.outcome }}" = "success" ]; then
            echo "- Release build: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release build: FAILED. Check the logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
```
